// monorepo（npm workspaces）：react-native 及其 gradle-plugin 被 hoist 到
// im-client/node_modules，不在 app-mobile/node_modules。用 node require.resolve
// 解析真实路径，不受 hoist 位置影响（RN 官方 monorepo 方案）。
// 注：pluginManagement{} 必须是 settings 首个语句，故两处 includeBuild 各自内联解析。
pluginManagement {
    includeBuild(new File(
        ["node", "--print",
         "require.resolve('@react-native/gradle-plugin/package.json', { paths: [require.resolve('react-native/package.json')] })"
        ].execute(null, rootDir).text.trim()
    ).getParentFile().absolutePath)
}
plugins { id("com.facebook.react.settings") }
extensions.configure(com.facebook.react.ReactSettingsExtension){ ex -> ex.autolinkLibrariesFromCommand() }
rootProject.name = 'AppMobile'
include ':app'
includeBuild(new File(
    ["node", "--print",
     "require.resolve('@react-native/gradle-plugin/package.json', { paths: [require.resolve('react-native/package.json')] })"
    ].execute(null, rootDir).text.trim()
).getParentFile().absolutePath)
