name: rbac-server

# ─────────────────────────────────────────────────────────────
# RBAC 中间件编排
#
# 分层启动（用 profile 控制）：
#   核心层（默认，无 profile）：mysql、redis
#   扩展层（--profile extra）  ：nginx、rabbitmq
#   完整层（--profile full）   ：kafka、elasticsearch、kibana
#
# 常用命令：
#   仅核心      : docker compose up -d
#   核心+扩展   : docker compose --profile extra up -d
#   全部        : docker compose --profile extra --profile full up -d
#   停止        : docker compose down
#   停止并清数据: docker compose down -v
# ─────────────────────────────────────────────────────────────

services:
  # ==================== 核心层 ====================
  mysql:
    image: mysql:8.4
    container_name: rbac-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-rbac_root_123}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-rbac}"
      MYSQL_USER: "${MYSQL_USER:-rbac}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-rbac_123}"
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    volumes:
      - mysql-data:/var/lib/mysql
      - ./config/mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-rbac_root_123}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [rbac-net]

  redis:
    image: redis:7.4
    container_name: rbac-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-rbac_redis_123}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-rbac_redis_123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [rbac-net]

  # ==================== 扩展层（--profile extra） ====================
  nginx:
    image: nginx:1.27
    container_name: rbac-nginx
    profiles: ["extra"]
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks: [rbac-net]

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rbac-rabbitmq
    profiles: ["extra"]
    restart: unless-stopped
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # 管理控制台 http://localhost:15672
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER:-rbac}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:-rbac_mq_123}"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks: [rbac-net]

  # ==================== 完整层（--profile full） ====================
  # Kafka：KRaft 模式，无需 ZooKeeper
  kafka:
    image: apache/kafka:3.9.0
    container_name: rbac-kafka
    profiles: ["full"]
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    networks: [rbac-net]

  elasticsearch:
    image: elasticsearch:8.15.3
    container_name: rbac-es
    profiles: ["full"]
    restart: unless-stopped
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ulimits:
      memlock: { soft: -1, hard: -1 }
    volumes:
      - es-data:/usr/share/elasticsearch/data
    networks: [rbac-net]

  kibana:
    image: kibana:8.15.3
    container_name: rbac-kibana
    profiles: ["full"]
    restart: unless-stopped
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    depends_on: [elasticsearch]
    networks: [rbac-net]

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  es-data:

networks:
  rbac-net:
    driver: bridge
