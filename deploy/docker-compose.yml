name: rbac-server #定义 Compose 项目名

# ─────────────────────────────────────────────────────────────
# RBAC 中间件编排
#
# 分层启动（用 profile 控制）：
#   核心层（默认，无 profile）：mysql、redis
#   扩展层（--profile extra）  ：nginx、rabbitmq
#   完整层（--profile full）   ：kafka、elasticsearch、kibana
#
# 常用命令：
#   仅核心      : docker compose up -d
#   核心+扩展   : docker compose --profile extra up -d
#   全部        : docker compose --profile extra --profile full up -d
#   停止        : docker compose down
#   停止并清数据: docker compose down -v
# ─────────────────────────────────────────────────────────────

services: #定义需要运行的服务
  # ==================== 核心层 ====================
  mysql:
    image: mysql:8.4
    container_name: rbac-mysql # 对应 --name
    restart: unless-stopped
    ports:
      - "3306:3306" # 对应 -p 3306:3306
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-rbac_root_123}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-rbac}"
      MYSQL_USER: "${MYSQL_USER:-rbac}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-rbac_123}"
      TZ: Asia/Shanghai
    command: #启动参数
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    volumes: #数据卷挂载（左=外部存储，右=容器内路径）
      - mysql-data:/var/lib/mysql # 我们手动实验时"缺"的那块，持久化数据
      - ./config/mysql/init:/docker-entrypoint-initdb.d # bind mount：注入你写的初始化 SQL
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-rbac_root_123}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [rbac-net]

  redis:
    image: redis:7.4
    container_name: rbac-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-rbac_redis_123}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-rbac_redis_123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [rbac-net]

  # ==================== 应用层（前后端，随核心层一起起） ====================
  # 后端 Spring Boot：本地代码构建成 jar，连容器内的 mysql / redis
  backend:
    build:
      context: ../backend
    image: rbac-backend
    container_name: rbac-backend
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: "${MYSQL_USER:-rbac}"
      DB_PASSWORD: "${MYSQL_PASSWORD:-rbac_123}"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-rbac_redis_123}"
      RBAC_JWT_SECRET: "${RBAC_JWT_SECRET:-rbac-server-default-secret-key-please-change-in-production-0123456789}"
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [rbac-net]
    # 不映射 8080 到宿主机，只让 frontend 容器走内网反代

  # 前端 nginx：发 dist 静态文件 + 把 /api 反代给 backend
  # 不再直接对外，改由前面的 caddy 走 HTTPS 反代（只留内网 expose）
  frontend:
    build:
      context: ../frontend
    image: rbac-frontend
    container_name: rbac-frontend
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - backend
    networks: [rbac-net]

  # Caddy：唯一对外入口，自动申请/续期 Let's Encrypt 证书 + HTTPS 终结
  # 配置见 ./config/caddy/Caddyfile（把域名换成你已备案的真实域名）
  caddy:
    image: caddy:2.8
    container_name: rbac-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data      # 证书持久化，重建容器不会重新申请（避免 LE 限流）
      - caddy-config:/config
    depends_on:
      - frontend
    networks: [rbac-net]

  # ==================== 扩展层（--profile extra） ====================
  nginx:
    image: nginx:1.27
    container_name: rbac-nginx
    profiles: ["extra"]
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks: [rbac-net]

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rbac-rabbitmq
    profiles: ["extra"]
    restart: unless-stopped
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # 管理控制台 http://localhost:15672
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER:-rbac}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:-rbac_mq_123}"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks: [rbac-net]

  # ==================== 完整层（--profile full） ====================
  # Kafka：KRaft 模式，无需 ZooKeeper
  kafka:
    image: apache/kafka:3.9.0
    container_name: rbac-kafka
    profiles: ["full"]
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    networks: [rbac-net]

  elasticsearch:
    image: elasticsearch:8.15.3
    container_name: rbac-es
    profiles: ["full"]
    restart: unless-stopped
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ulimits:
      memlock: { soft: -1, hard: -1 }
    volumes:
      - es-data:/usr/share/elasticsearch/data
    networks: [rbac-net]

  kibana:
    image: kibana:8.15.3
    container_name: rbac-kibana
    profiles: ["full"]
    restart: unless-stopped
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    depends_on: [elasticsearch]
    networks: [rbac-net]

volumes: #声明持久化数据卷
  mysql-data:
  redis-data:
  rabbitmq-data:
  es-data:
  caddy-data:
  caddy-config:

networks: #声明服务通信网络
  rbac-net:
    driver: bridge
