server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: rbac-server

  # ── 激活的环境：默认 dev，可用环境变量 SPRING_PROFILES_ACTIVE 覆盖（如 prod）──
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # ── 国际化（Accept-Language 决定语言，默认 zh-CN）──
  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false

  # ── Flyway 数据库迁移（脚本目录 classpath:db/migration，取代 spring.sql.init）──
  # 各环境启动时自动迁移；已有表的旧库首次迁移会被收编为 V1 基线、不重跑建表 DDL。
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

  # ── IM：消息存 MongoDB（会话/成员/群元数据仍在 MySQL）──
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://rbac:rbac123456@localhost:27017/rbac_im?authSource=admin}

  # ── IM：网关↔logic 经 Kafka 解耦 ──
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: im-logic
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

# ── MyBatis-Plus（与环境无关的公共配置；SQL 打印开关放各 profile）──
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.rbac.**.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      # 逻辑删除（0 未删 / 1 已删），后续实体加 @TableLogic 生效
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ── RBAC 自定义配置：绑定到 com.rbac.common.config.RbacProperties ──
# 这里放各环境一致的默认值；secret 由各 profile 覆盖，ttl 可被 profile 覆盖。
rbac:
  jwt:
    # Access Token 有效期（秒），默认 2 小时
    access-ttl: 7200
    # Refresh Token 有效期（秒），默认 7 天
    refresh-ttl: 604800
  security:
    # 新建用户默认密码（明文，落库前加密）
    default-password: 123456
  # ── IM 相关阈值 ──
  im:
    recall-window-seconds: 120
    mention-all-admin-only: true
    group-max-members: 500
    media:
      endpoint: http://localhost:9000
      access-key: rbac
      secret-key: rbac123456
      bucket: im-media
      region: us-east-1
      put-ttl-seconds: 300
      get-ttl-seconds: 300
      limits:
        image:
          max-size: 10485760
          mimes: [image/jpeg, image/png, image/gif, image/webp]
        audio:
          max-size: 20971520
          mimes: [audio/mpeg, audio/mp4, audio/aac, audio/ogg, audio/wav]
        file:
          max-size: 104857600
          mimes: ["*"]

# ── Actuator 可观测性端点（路径在 context-path 下，即 /api/actuator/**）──
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true          # 启用 liveness / readiness 探针组
      show-details: when-authorized   # 详情仅对已认证用户可见
  info:
    env:
      enabled: true
info:
  app:
    name: ${spring.application.name}
    description: RBAC 权限管理系统
