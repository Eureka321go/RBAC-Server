server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: rbac-server

  # ── 数据源（对接 deploy/docker-compose.yml 里的 MySQL）──
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/rbac?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: rbac
    password: rbac_123
    hikari:
      pool-name: RbacHikariPool
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000

  # ── Redis（对接 deploy 里的 Redis）──
  data:
    redis:
      host: localhost
      port: 6379
      password: rbac_redis_123
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

  # ── SQL 初始化（幂等：schema 用 IF NOT EXISTS，data 用 INSERT IGNORE）──
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql
      continue-on-error: false

# ── MyBatis-Plus ──
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.rbac.**.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # 逻辑删除（0 未删 / 1 已删），后续实体加 @TableLogic 生效
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ── RBAC 自定义配置 ──
rbac:
  jwt:
    # 生产环境务必用环境变量覆盖，勿使用默认值
    secret: ${RBAC_JWT_SECRET:rbac-server-default-secret-key-please-change-in-production-0123456789}
    # Access Token 有效期（秒），默认 2 小时
    access-ttl: 7200
    # Refresh Token 有效期（秒），默认 7 天
    refresh-ttl: 604800

# ── 日志 ──
logging:
  level:
    com.rbac: debug
    org.springframework.security: info
