# 通用
result.success=操作成功
error.validation=参数校验失败
error.accessDenied=无权限访问
error.internal=服务器内部错误

# 认证
auth.badCredentials=账号或密码错误
auth.disabled=账号已被禁用
auth.refreshInvalid=refreshToken 无效或已过期
auth.refreshTypeError=refreshToken 类型错误
auth.loginExpired=登录已失效，请重新登录
auth.accountUnavailable=账号不可用，请重新登录
auth.notLoggedIn=未登录或登录已失效

# 角色
role.notFound=角色不存在
role.builtinCodeImmutable=内置角色编码不允许修改
role.builtinUndeletable=内置角色不允许删除
role.stillBound=该角色仍有用户绑定，无法删除
role.codeExists=角色编码已存在

# 参数
config.notFound=参数不存在
config.builtinKeyImmutable=内置参数键不允许修改
config.builtinUndeletable=内置参数不允许删除
config.keyExists=参数键已存在

# 岗位
post.notFound=岗位不存在
post.codeExists=岗位编码已存在

# 用户
user.notFound=用户不存在
user.usernameExists=账号已存在
user.superAdminImmutable=无权修改超级管理员
user.cannotDeleteSelf=不能删除当前登录用户
user.superAdminUndeletable=超级管理员不允许删除
user.superAdminUndisable=超级管理员不允许禁用
user.cannotDisableSelf=不能禁用当前登录用户
user.superAdminPwdImmutable=无权重置超级管理员密码
user.superAdminRoleImmutable=超级管理员角色不允许调整

# 部门
dept.notFound=部门不存在
dept.parentSelf=上级部门不能是自身
dept.hasChildren=存在子部门，无法删除
dept.hasUsers=部门下存在用户，无法删除

# 菜单
menu.notFound=菜单不存在
menu.parentSelf=父菜单不能是自身
menu.hasChildren=存在子菜单，无法删除

# 字典
dict.typeNotFound=字典类型不存在
dict.dataNotFound=字典数据不存在
dict.codeExists=字典编码已存在

